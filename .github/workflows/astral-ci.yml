# ASTRAL CI: tests, lint, dependency audit and secret scan on the public template repository.
# Skipped everywhere else (customer copies, GHES) so it never queues on a runner that does not exist.
name: ASTRAL CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: new advisories against the pinned dependencies

permissions:
  contents: read

concurrency:
  group: astral-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'cqrenet/astral'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet PyYAML shellcheck-py bandit pip-audit
          # The MCP smoke test starts the real server, so install its direct dependencies too.
          "$RUNNER_TEMP/ci-venv/bin/pip" install --quiet -r infra/mcp-server/requirements.in
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Shell scripts
        run: shellcheck -x --severity=warning scripts/*.sh

      - name: Static analysis (high severity)
        run: bandit -q -r scripts infra deploy -lll

      - name: Dependency audit
        run: |
          for lock in infra/mcp-server/requirements.txt infra/change-probe/requirements.txt; do
            pip-audit -r "$lock" --no-deps --disable-pip
          done

  secrets:
    if: github.repository == 'cqrenet/astral' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb   # v3.99.8
        with:
          extra_args: --results=verified,unknown

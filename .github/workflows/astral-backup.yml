# ASTRAL backup: export Intune and Entra configuration, commit drift to drift/* branches,
# then create/refresh one rolling PR per workload. GitHub counterpart of azure-pipelines.yml.
# Logic lives in scripts/backup_intune.sh, scripts/backup_entra.sh (shared with Gitea).
#
# Runs daily, on demand, and when astral-probe.yml detects tenant changes.
# Security model and setup: docs/github-enterprise-setup.md.
name: ASTRAL backup

on:
  schedule:
    - cron: "0 2 * * *"   # UTC; with the default BACKUP_TIMEZONE/FULL_RUN_HOUR this is the daily full run
  workflow_dispatch:
    inputs:
      forceFullRun:
        description: Force a full run (all Entra categories, full validation)
        type: boolean
        default: false

permissions: {}   # every job opts in to what it needs

concurrency:
  group: astral-backup
  cancel-in-progress: false

env:
  ASTRAL_SCM: github
  INTUNECD_VERSION: "2.6.0"
  FORCE_FULL_RUN: ${{ inputs.forceFullRun || 'false' }}
  # Empty values fall back to the defaults in the backup scripts.
  BASELINE_BRANCH: ${{ vars.BASELINE_BRANCH }}
  DRIFT_BRANCH_INTUNE: ${{ vars.DRIFT_BRANCH_INTUNE }}
  DRIFT_BRANCH_ENTRA: ${{ vars.DRIFT_BRANCH_ENTRA }}
  USER_NAME: ${{ vars.USER_NAME }}
  USER_EMAIL: ${{ vars.USER_EMAIL }}
  BACKUP_TIMEZONE: ${{ vars.BACKUP_TIMEZONE }}
  FULL_RUN_HOUR: ${{ vars.FULL_RUN_HOUR }}
  GRAPH_AUTH_METHOD: ${{ vars.GRAPH_AUTH_METHOD }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ENABLE_ENTRA_CONDITIONAL_ACCESS: ${{ vars.ENABLE_ENTRA_CONDITIONAL_ACCESS || 'true' }}
  EXCLUDE_SCRIPT_BACKUP: ${{ vars.EXCLUDE_SCRIPT_BACKUP || 'false' }}
  INTUNE_EXCLUDE_CSV: ${{ vars.INTUNE_EXCLUDE_CSV }}
  ENABLE_WORKLOAD_ENTRA: ${{ vars.ENABLE_WORKLOAD_ENTRA || 'true' }}
  ENTRA_INCLUDE_NAMED_LOCATIONS: ${{ vars.ENTRA_INCLUDE_NAMED_LOCATIONS || 'true' }}
  ENTRA_INCLUDE_AUTHENTICATION_STRENGTHS: ${{ vars.ENTRA_INCLUDE_AUTHENTICATION_STRENGTHS || 'true' }}
  ENTRA_INCLUDE_CONDITIONAL_ACCESS: ${{ vars.ENTRA_INCLUDE_CONDITIONAL_ACCESS || 'true' }}
  ENTRA_INCLUDE_ENTERPRISE_APPS: ${{ vars.ENTRA_INCLUDE_ENTERPRISE_APPS || 'true' }}
  ENTRA_INCLUDE_APP_REGISTRATIONS: ${{ vars.ENTRA_INCLUDE_APP_REGISTRATIONS || 'true' }}
  ENTRA_ENTERPRISE_APP_WORKERS: ${{ vars.ENTRA_ENTERPRISE_APP_WORKERS }}
  ENTRA_INCLUDE_GROUPS: ${{ vars.ENTRA_INCLUDE_GROUPS || 'true' }}
  ENTRA_INCLUDE_ROLE_ASSIGNMENTS: ${{ vars.ENTRA_INCLUDE_ROLE_ASSIGNMENTS || 'true' }}
  ENTRA_INCLUDE_AUTH_METHODS_POLICY: ${{ vars.ENTRA_INCLUDE_AUTH_METHODS_POLICY || 'true' }}
  ENTRA_INCLUDE_CROSS_TENANT_ACCESS: ${{ vars.ENTRA_INCLUDE_CROSS_TENANT_ACCESS || 'true' }}
  ENTRA_INCLUDE_IDENTITY_PROTECTION: ${{ vars.ENTRA_INCLUDE_IDENTITY_PROTECTION || 'true' }}
  ENTRA_INCLUDE_PRIVILEGED_GROUPS: ${{ vars.ENTRA_INCLUDE_PRIVILEGED_GROUPS || 'true' }}
  ENTRA_INCLUDE_PIM_POLICIES: ${{ vars.ENTRA_INCLUDE_PIM_POLICIES || 'true' }}
  ENTRA_INCLUDE_SECURITY_SETTINGS: ${{ vars.ENTRA_INCLUDE_SECURITY_SETTINGS || 'true' }}
  ENTRA_WATCH_GROUPS_CSV: ${{ vars.ENTRA_WATCH_GROUPS_CSV }}
  # Commit attribution fallback: scheduled runs use the service identity.
  BUILD_REASON: ${{ github.event_name == 'schedule' && 'Schedule' || 'Manual' }}
  BUILD_REQUESTEDFOR: ${{ github.actor }}

jobs:
  intune:
    name: Backup Intune
    if: github.repository != 'cqrenet/astral' && vars.ENABLE_WORKLOAD_INTUNE != 'false'
    runs-on: ${{ fromJSON(vars.ASTRAL_RUNS_ON || '["self-hosted","astral"]') }}
    environment: astral-backup   # main only; OIDC federated credential is bound to this environment
    permissions:
      contents: write   # push drift/intune
      id-token: write   # only used when GRAPH_AUTH_METHOD=github-oidc
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.commit.outputs.CHANGE_DETECTED }}
      sync: ${{ steps.commit.outputs.ROLLING_PR_SYNC_REQUIRED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/astral-venv"
          "$RUNNER_TEMP/astral-venv/bin/pip" install --quiet "IntuneCD==$INTUNECD_VERSION" "PyYAML==6.0.3"
          echo "$RUNNER_TEMP/astral-venv/bin" >> "$GITHUB_PATH"

      - name: Get Graph token
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          args=(--warn-missing Group.Read.All)
          if [ "$EXCLUDE_SCRIPT_BACKUP" != "true" ]; then
            args+=(--require "DeviceManagementScripts.Read.All|DeviceManagementScripts.ReadWrite.All")
          fi
          if [ "$ENABLE_ENTRA_CONDITIONAL_ACCESS" != "true" ]; then
            args+=(--require Policy.Read.All --require Policy.Read.ConditionalAccess)
          fi
          python3 scripts/get_graph_token.py "${args[@]}"

      - name: Back up and commit Intune drift
        id: commit
        run: bash scripts/backup_intune.sh

  intune-review:
    name: Intune rolling PR
    needs: intune
    if: needs.intune.outputs.changed == '1' || needs.intune.outputs.sync == '1'
    uses: ./.github/workflows/astral-review.yml
    with:
      workload: intune
      ensure-pr: true
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      actions: write

  entra:
    name: Backup Entra
    if: github.repository != 'cqrenet/astral' && vars.ENABLE_WORKLOAD_ENTRA != 'false'
    runs-on: ${{ fromJSON(vars.ASTRAL_RUNS_ON || '["self-hosted","astral"]') }}
    environment: astral-backup
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.CHANGE_DETECTED }}
      sync: ${{ steps.commit.outputs.ROLLING_PR_SYNC_REQUIRED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0

      - name: Get Graph token
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          args=(--warn-missing AuditLog.Read.All)
          if [ "$ENTRA_INCLUDE_CONDITIONAL_ACCESS" = "true" ]; then
            args+=(--require Policy.Read.All --require Policy.Read.ConditionalAccess)
          fi
          if [ "$ENTRA_INCLUDE_APP_REGISTRATIONS" = "true" ] || [ "$ENTRA_INCLUDE_ENTERPRISE_APPS" = "true" ]; then
            args+=(--require Application.Read.All)
          fi
          python3 scripts/get_graph_token.py "${args[@]}"

      - name: Back up and commit Entra drift
        id: commit
        run: bash scripts/backup_entra.sh

  entra-review:
    name: Entra rolling PR
    needs: entra
    if: needs.entra.outputs.changed == '1' || needs.entra.outputs.sync == '1'
    uses: ./.github/workflows/astral-review.yml
    with:
      workload: entra
      ensure-pr: true
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      actions: write

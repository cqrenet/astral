trigger: none
pr: none

# One-time validation pipeline for ASTRAL onboarding.
# Import this pipeline, run it manually, and verify all checks pass.

variables:
  # Uncomment after creating your tenant variable group.
  # - group: vg-astral
  - template: ../templates/variables-common.yml

jobs:
  - job: validate_environment
    displayName: Validate ASTRAL deployment
    pool:
      name: $(AGENT_POOL_NAME)
    steps:
      - checkout: self
        persistCredentials: true

      - task: AzurePowerShell@5
        displayName: Validate Graph token acquisition
        inputs:
          azureSubscription: $(SERVICE_CONNECTION_NAME)
          azurePowerShellVersion: LatestVersion
          ScriptType: inlineScript
          Inline: |
            $getTokenParams = @{
              ResourceTypeName = 'MSGraph'
              AsSecureString   = $true
              ErrorAction      = 'Stop'
            }
            $tokenCommand = Get-Command Get-AzAccessToken -ErrorAction Stop
            if ($tokenCommand.Parameters.ContainsKey('ForceRefresh')) {
              $getTokenParams['ForceRefresh'] = $true
            }
            $accessToken = ([PSCredential]::New('dummy', (Get-AzAccessToken @getTokenParams).Token).GetNetworkCredential().Password)

            $tokenParts = $accessToken.Split('.')
            if ($tokenParts.Length -lt 2) { throw "Invalid Graph access token format." }
            $payload = $tokenParts[1].Replace('-', '+').Replace('_', '/')
            switch ($payload.Length % 4) {
              2 { $payload += '==' }
              3 { $payload += '=' }
            }
            $payloadJson = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($payload))
            $claims = $payloadJson | ConvertFrom-Json
            $roles = @($claims.roles)
            $sortedRoles = $roles | Sort-Object
            Write-Host "Graph token roles: $($sortedRoles -join ', ')"

            $requiredReadRoles = @(
              "Device.Read.All",
              "DeviceManagementApps.Read.All",
              "DeviceManagementConfiguration.Read.All",
              "DeviceManagementManagedDevices.Read.All",
              "DeviceManagementRBAC.Read.All",
              "DeviceManagementScripts.Read.All",
              "DeviceManagementServiceConfig.Read.All",
              "Group.Read.All",
              "Policy.Read.All",
              "Policy.Read.ConditionalAccess",
              "Policy.Read.DeviceConfiguration",
              "User.Read.All",
              "Application.Read.All"
            )

            $missing = $requiredReadRoles | Where-Object { $_ -notin $sortedRoles }
            if ($missing) {
              throw "Missing required Graph roles: $($missing -join ', ')"
            }
            Write-Host "All required read roles are present." -ForegroundColor Green

            # Export token for subsequent steps
            Write-Host "##vso[task.setvariable variable=GRAPH_TOKEN;issecret=true]$accessToken"

      - task: Bash@3
        displayName: Validate Graph read access
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            TOKEN="$(GRAPH_TOKEN)"
            URL="https://graph.microsoft.com/v1.0/organization?\$select=id,displayName"
            RESPONSE=$(curl -sf -H "Authorization: Bearer $TOKEN" "$URL")
            echo "Graph read test response: $RESPONSE"
            echo "Graph connectivity confirmed."

      - task: Bash@3
        displayName: Validate PR creation permission
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            TOKEN="$(System.AccessToken)"
            COLLECTION_URI="$(System.CollectionUri)"
            PROJECT="$(System.TeamProject)"
            REPO_ID="$(Build.Repository.ID)"
            BASE_URL="${COLLECTION_URI%/}/${PROJECT}/_apis/git/repositories/${REPO_ID}"

            curl_api() {
              local METHOD="$1"; shift
              local URL="$1"; shift
              local RESPONSE HTTP_CODE
              RESPONSE=$(curl -s -w "\n%{http_code}" -u ":$TOKEN" -H "Content-Type: application/json" -X "$METHOD" "$@" "$URL")
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | head -n -1)
              if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
                echo "##[error]API call failed ($METHOD $URL) — HTTP $HTTP_CODE"
                echo "$BODY"
                exit 1
              fi
              echo "$BODY"
            }

            # Get the current HEAD commit of main to create a temp branch
            echo "Getting main branch HEAD..."
            REFS_RESPONSE=$(curl_api GET "${BASE_URL}/refs?filter=heads/main&api-version=7.1")
            MAIN_SHA=$(echo "$REFS_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'][0]['objectId'])")
            echo "main HEAD: $MAIN_SHA"

            # Create a temporary branch
            TEMP_BRANCH="validation/astral-validate-$(date +%s)"
            echo "Creating temp branch $TEMP_BRANCH..."
            curl_api POST "${BASE_URL}/refs?api-version=7.1" \
              -d "[{\"name\":\"refs/heads/${TEMP_BRANCH}\",\"oldObjectId\":\"0000000000000000000000000000000000000000\",\"newObjectId\":\"${MAIN_SHA}\"}]" > /dev/null

            # Create draft PR from temp branch to main
            echo "Creating test PR..."
            PR_BODY="{\"sourceRefName\":\"refs/heads/${TEMP_BRANCH}\",\"targetRefName\":\"refs/heads/main\",\"title\":\"ASTRAL validation test PR\",\"description\":\"Temporary PR created by validate-deployment pipeline. Will be abandoned immediately.\",\"isDraft\":true}"
            PR_RESPONSE=$(curl_api POST "${BASE_URL}/pullrequests?api-version=7.1" -d "$PR_BODY")
            PR_ID=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['pullRequestId'])")
            echo "Created test PR #$PR_ID"

            # Abandon the PR
            echo "Abandoning test PR #$PR_ID..."
            curl_api PATCH "${BASE_URL}/pullrequests/${PR_ID}?api-version=7.1" \
              -d '{"status":"abandoned"}' > /dev/null

            # Delete the temp branch
            echo "Deleting temp branch..."
            curl_api POST "${BASE_URL}/refs?api-version=7.1" \
              -d "[{\"name\":\"refs/heads/${TEMP_BRANCH}\",\"oldObjectId\":\"${MAIN_SHA}\",\"newObjectId\":\"0000000000000000000000000000000000000000\"}]" > /dev/null

            echo "PR creation and abandonment successful."

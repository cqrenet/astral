<svg width="960" height="264" viewBox="0 0 960 264" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ASTRAL logo</title>
  <desc id="desc">ASTRAL — Admin Security: Tenant Review, Automation &amp; Lifecycle</desc>
  <defs>
    <linearGradient id="circleGrad" x1="28" y1="28" x2="168" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A2E"/>
      <stop offset="0.55" stop-color="#0F2940"/>
      <stop offset="1" stop-color="#0C3554"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="90" y1="56" x2="148" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="48" y1="68" x2="188" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Icon circle -->
  <circle cx="132" cy="132" r="112" fill="url(#circleGrad)"/>
  <circle cx="132" cy="132" r="112" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <!-- Orbit ring -->
  <ellipse cx="132" cy="132" rx="82" ry="44" transform="rotate(-22 132 132)" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5"/>

  <!-- 6-pointed star -->
  <path d="M132 68 L145 106 L182 98 L155 132 L182 166 L145 158 L132 196 L119 158 L82 166 L109 132 L82 98 L119 106 Z" fill="url(#starGrad)"/>

  <!-- Orbit dot -->
  <circle cx="209" cy="102" r="8" fill="#2DD4BF"/>
  <circle cx="209" cy="102" r="4" fill="#5EEAD4"/>

  <!-- Accent dots -->
  <circle cx="88" cy="52" r="3" fill="#E0F2FE" opacity="0.6"/>
  <circle cx="178" cy="46" r="2.5" fill="#FDE68A" opacity="0.75"/>
  <circle cx="78" cy="210" r="2.5" fill="#BAE6FD" opacity="0.6"/>
  <circle cx="185" cy="218" r="3" fill="#E0F2FE" opacity="0.55"/>

  <!-- Small sparkle -->
  <path d="M208 66 L211.5 75 L221 78.5 L211.5 82 L208 91 L204.5 82 L195 78.5 L204.5 75 Z" fill="#F8FAFC" opacity="0.85"/>

  <!-- Wordmark -->
  <text x="270" y="158" fill="#0F2940" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="116" font-weight="800" letter-spacing="10">ASTRAL</text>

  <!-- Divider -->
  <line x1="270" y1="184" x2="930" y2="184" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Backronym -->
  <text x="272" y="216" fill="#0E7490" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="500" letter-spacing="1.8">Admin Security: Tenant Review, Automation &amp; Lifecycle</text>

  <!-- Tagline -->
  <text x="272" y="248" fill="#64748B" font-family="'Avenir Next', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="400" letter-spacing="0.6">Part of the CQRE M365 governance suite · cqre.net</text>
</svg>

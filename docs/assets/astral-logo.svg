      <stop offset="0.52" stop-color="#123B68"/>
      <stop offset="1" stop-color="#0D6E8E"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 110) rotate(90) scale(88)">

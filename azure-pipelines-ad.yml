# Active Directory backup: export on-premises AD configuration (GPOs, OUs, privileged groups, password
# policies, trusts, sites) from a domain-joined self-hosted Windows agent, commit drift to drift/ad, then
# create/refresh the rolling PR. Setup: docs/active-directory-setup.md.
#
# Opt-in: set ENABLE_WORKLOAD_AD=true in the variable group once the agent pool exists.
# Backup only: there is no AD restore pipeline, so /reject decisions never change the directory.
# Only backup_ad runs on the AD pool; PR handling runs on the normal pool.
trigger: none

schedules:
  - cron: "30 2 * * *"
    displayName: "Daily Active Directory backup"
    branches:
      include:
        - main
    always: true
    batch: true

variables:
  # Same variable group and name as the other pipelines (see azure-pipelines.yml).
  - group: vg-astral
  - template: templates/variables-common.yml
  - name: ROLLING_PR_TITLE_AD
    value: "Active Directory drift review (rolling)"
  - name: AD_BACKUP_SUBDIR
    value: ad
  - name: AD_INCLUDE_GPOS
    value: true
  - name: AD_INCLUDE_OUS
    value: true
  - name: AD_INCLUDE_PRIVILEGED_GROUPS
    value: true
  - name: AD_INCLUDE_PASSWORD_POLICIES
    value: true
  - name: AD_INCLUDE_TRUSTS
    value: true
  - name: AD_INCLUDE_SITES
    value: true
  # Name the administrator behind each change from the domain controllers' audit log (docs/active-directory-setup.md).
  - name: AD_ATTRIBUTE_AUTHORS
    value: true
  - name: ROLLING_PR_MERGE_STRATEGY
    value: rebase

jobs:
  - job: backup_ad
    displayName: Back up Active Directory
    condition: eq(variables['ENABLE_WORKLOAD_AD'], 'true')
    pool:
      name: $(AD_AGENT_POOL_NAME)
    timeoutInMinutes: 60
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - powershell: python scripts/backup_ad.py
        name: commitAd
        displayName: Back up and commit Active Directory drift
        workingDirectory: $(Build.SourcesDirectory)
        failOnStderr: false
        env:
          BACKUP_FOLDER: $(BACKUP_FOLDER)
          AD_BACKUP_SUBDIR: $(AD_BACKUP_SUBDIR)
          BASELINE_BRANCH: $(BASELINE_BRANCH)
          DRIFT_BRANCH_AD: $(DRIFT_BRANCH_AD)
          USER_NAME: $(USER_NAME)
          USER_EMAIL: $(USER_EMAIL)
          AD_SERVER: $(AD_SERVER)
          AD_INCLUDE_GPOS: $(AD_INCLUDE_GPOS)
          AD_INCLUDE_OUS: $(AD_INCLUDE_OUS)
          AD_INCLUDE_PRIVILEGED_GROUPS: $(AD_INCLUDE_PRIVILEGED_GROUPS)
          AD_INCLUDE_PASSWORD_POLICIES: $(AD_INCLUDE_PASSWORD_POLICIES)
          AD_INCLUDE_TRUSTS: $(AD_INCLUDE_TRUSTS)
          AD_INCLUDE_SITES: $(AD_INCLUDE_SITES)
          AD_EXTRA_PRIVILEGED_GROUPS_CSV: $(AD_EXTRA_PRIVILEGED_GROUPS_CSV)
          AD_ATTRIBUTE_AUTHORS: $(AD_ATTRIBUTE_AUTHORS)
          AD_AUDIT_LOOKBACK_HOURS: $(AD_AUDIT_LOOKBACK_HOURS)
          AD_AUDIT_SERVERS: $(AD_AUDIT_SERVERS)

  - job: create_or_update_ad_pr
    displayName: Create or update rolling Active Directory drift PR
    dependsOn: backup_ad
    condition: and(eq(variables['ENABLE_WORKLOAD_AD'], 'true'), succeeded(), or(eq(dependencies.backup_ad.outputs['commitAd.CHANGE_DETECTED'], '1'), eq(dependencies.backup_ad.outputs['commitAd.ROLLING_PR_SYNC_REQUIRED'], '1')))
    pool:
      name: $(AGENT_POOL_NAME)
    steps:
      - checkout: self
        persistCredentials: true

      - task: Bash@3
        displayName: Ensure rolling Active Directory PR exists
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            python3 "$(Build.SourcesDirectory)/scripts/ensure_rolling_pr.py" \
              --repo-root "$(Build.SourcesDirectory)" \
              --workload "ad" \
              --drift-branch "$(DRIFT_BRANCH_AD)" \
              --baseline-branch "$(BASELINE_BRANCH)" \
              --pr-title "$(ROLLING_PR_TITLE_AD)"
          failOnStderr: true
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)
          BUILD_REPOSITORY_ID: $(Build.Repository.ID)
          BUILD_BUILDNUMBER: $(Build.BuildNumber)
          BUILD_BUILDID: $(Build.BuildId)
          AUTO_REMEDIATE_ON_PR_REJECTION: false   # no AD restore pipeline
          PR_DECISION_ALLOWED_REVIEWERS: $(PR_DECISION_ALLOWED_REVIEWERS)
          ROLLING_PR_DELAY_REVIEWER_NOTIFICATIONS: $(ROLLING_PR_DELAY_REVIEWER_NOTIFICATIONS)
          ROLLING_PR_MERGE_STRATEGY: $(ROLLING_PR_MERGE_STRATEGY)

  - job: update_ad_pr_summary
    displayName: Update rolling Active Directory PR summary
    dependsOn:
      - backup_ad
      - create_or_update_ad_pr
    condition: and(eq(variables['ENABLE_WORKLOAD_AD'], 'true'), eq(variables['ENABLE_PR_REVIEW_SUMMARY'], 'true'), or(eq(dependencies.backup_ad.outputs['commitAd.CHANGE_DETECTED'], '1'), eq(dependencies.backup_ad.outputs['commitAd.ROLLING_PR_SYNC_REQUIRED'], '1')), in(dependencies.backup_ad.result, 'Succeeded', 'SucceededWithIssues'), in(dependencies.create_or_update_ad_pr.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'))
    pool:
      name: $(AGENT_POOL_NAME)
    steps:
      - checkout: self
        persistCredentials: true

      - task: Bash@3
        displayName: Update automated reviewer summary (Active Directory)
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            python3 "$(Build.SourcesDirectory)/scripts/update_pr_review_summary.py" \
              --repo-root "$(Build.SourcesDirectory)" \
              --workload "ad" \
              --backup-folder "$(BACKUP_FOLDER)" \
              --reports-subdir "$(REPORTS_SUBDIR)" \
              --drift-branch "$(DRIFT_BRANCH_AD)" \
              --baseline-branch "$(BASELINE_BRANCH)"
          workingDirectory: "$(Build.SourcesDirectory)"
          failOnStderr: false
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          PR_DECISION_ALLOWED_REVIEWERS: $(PR_DECISION_ALLOWED_REVIEWERS)
          SYSTEM_COLLECTIONURI: $(System.CollectionUri)
          SYSTEM_TEAMPROJECT: $(System.TeamProject)
          BUILD_REPOSITORY_ID: $(Build.Repository.ID)
          ENABLE_PR_AI_SUMMARY: $(ENABLE_PR_AI_SUMMARY)
          AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
          AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
          AZURE_OPENAI_API_KEY: $(AZURE_OPENAI_API_KEY)
          AZURE_OPENAI_API_VERSION: $(AZURE_OPENAI_API_VERSION)
          REQUIRE_CHANGE_TICKETS: $(REQUIRE_CHANGE_TICKETS)
          CHANGE_TICKET_REGEX: $(CHANGE_TICKET_REGEX)
          DEBUG_CHANGE_TICKET_THREADS: $(DEBUG_CHANGE_TICKET_THREADS)
          ROLLING_PR_DELAY_REVIEWER_NOTIFICATIONS: $(ROLLING_PR_DELAY_REVIEWER_NOTIFICATIONS)

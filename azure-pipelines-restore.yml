trigger: none
pr: none

parameters:
  - name: dryRun
    displayName: Dry run only (report, no changes pushed)
    type: boolean
    default: true
  - name: updateAssignments
    displayName: Update assignments
    type: boolean
    default: true
  - name: removeObjectsNotInBaseline
    displayName: Remove objects not present in baseline
    type: boolean
    default: false
  - name: includeEntraUpdate
    displayName: Include Entra updates
    type: boolean
    default: false
  - name: baselineBranch
    displayName: Baseline branch to restore from
    type: string
    default: main
  - name: baselineRef
    displayName: Optional historical git ref (branch/tag/commit) to restore from
    type: string
    default: ""
  - name: restoreMode
    displayName: Restore mode (`full` or `selective`)
    type: string
    default: full
    values:
      - full
      - selective
  - name: restorePathsCsv
    displayName: Selective restore file paths (CSV; repo-relative or intune-relative)
    type: string
    default: ""
  - name: maxWorkers
    displayName: IntuneCD max workers
    type: number
    default: 10
  - name: excludeCsv
    displayName: Exclude object categories (comma-separated IntuneCD keys)
    type: string
    default: ""

variables:
  # Variable group containing tenant-specific secrets and values.
  # Name must be exactly "vg-astral" — ADO resolves group references at compile
  # time as literal strings, so this cannot be parameterised. The bootstrap script
  # (deploy/bootstrap-tenant.ps1) creates a group with this name automatically.
  - group: vg-astral
  - template: templates/variables-common.yml
  - name: BACKUP_FOLDER
    value: tenant-state
  - name: INTUNE_BACKUP_SUBDIR
    value: intune
  - name: INTUNECD_VERSION
    value: 2.5.0

jobs:
  - job: restore_from_baseline
    displayName: Restore tenant from approved baseline
    pool:
      name: $(AGENT_POOL_NAME)
    steps:
      - checkout: self
        persistCredentials: true

      # Uncomment the block below for agent-side debugging.
      # - task: Bash@3
      #   displayName: DEBUG — dump agent state (restore)
      #   inputs:
      #     targetType: inline
      #     script: |
      #       set -euo pipefail
      #       echo "=== Variables ==="
      #       echo "BACKUP_FOLDER=$(BACKUP_FOLDER)"
      #       echo "INTUNE_BACKUP_SUBDIR=$(INTUNE_BACKUP_SUBDIR)"
      #       echo "BASELINE_BRANCH=$(BASELINE_BRANCH)"
      #       echo "=== Git state ==="
      #       git branch -a
      #       git log --oneline -5
      #       git status --short
      #       echo "=== File system ==="
      #       ls -la "$(Build.SourcesDirectory)"
      #       find "$(BACKUP_FOLDER)" -maxdepth 2 -type d 2>/dev/null || true
      #   workingDirectory: "$(Build.SourcesDirectory)"

      # Restore checks out an older snapshot below; run helper scripts from a copy of the
      # current (pipeline) revision so historical refs without these files still work.
      - task: Bash@3
        displayName: Snapshot restore helper scripts
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            rm -rf "$(Agent.TempDirectory)/astral-scripts"
            cp -R "$(Build.SourcesDirectory)/scripts" "$(Agent.TempDirectory)/astral-scripts"
            echo "##vso[task.setvariable variable=ASTRAL_SCRIPTS]$(Agent.TempDirectory)/astral-scripts"

      - task: Bash@3
        displayName: Checkout approved baseline snapshot
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            bash "$(ASTRAL_SCRIPTS)/restore_checkout_ref.sh"
          workingDirectory: "$(Build.SourcesDirectory)"
        env:
          TARGET_REF_RAW: ${{ parameters.baselineRef }}
          BASELINE_BRANCH_PARAM: ${{ parameters.baselineBranch }}
          # Trusted: from variables-common.yml, not settable at queue time.
          APPROVED_BRANCH: $(BASELINE_BRANCH)
          RESTORE_DATA_DIR: $(Build.SourcesDirectory)/$(BACKUP_FOLDER)/$(INTUNE_BACKUP_SUBDIR)

      - task: Bash@3
        displayName: Install IntuneCD
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            pip3 install "IntuneCD==$(INTUNECD_VERSION)"

      - task: Bash@3
        displayName: Prepare restore payload scope
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            python3 "$(ASTRAL_SCRIPTS)/restore_prepare_scope.py"
        env:
          RESTORE_MODE: ${{ parameters.restoreMode }}
          RESTORE_PATHS_CSV: ${{ parameters.restorePathsCsv }}
          BACKUP_FOLDER: $(BACKUP_FOLDER)
          INTUNE_BACKUP_SUBDIR: $(INTUNE_BACKUP_SUBDIR)

      - task: AzurePowerShell@5
        displayName: Get Graph token for restore
        inputs:
          azureSubscription: $(SERVICE_CONNECTION_NAME)
          azurePowerShellVersion: LatestVersion
          ScriptType: inlineScript
          Inline: |
            $getTokenParams = @{
              ResourceTypeName = 'MSGraph'
              AsSecureString   = $true
              ErrorAction      = 'Stop'
            }
            $tokenCommand = Get-Command Get-AzAccessToken -ErrorAction Stop
            if ($tokenCommand.Parameters.ContainsKey('ForceRefresh')) {
              $getTokenParams['ForceRefresh'] = $true
            }
            $accessToken = ([PSCredential]::New('dummy', (Get-AzAccessToken @getTokenParams).Token).GetNetworkCredential().Password)

            $tokenParts = $accessToken.Split('.')
            if ($tokenParts.Length -lt 2) { throw "Invalid Graph access token format." }
            $payload = $tokenParts[1].Replace('-', '+').Replace('_', '/')
            switch ($payload.Length % 4) {
              2 { $payload += '==' }
              3 { $payload += '=' }
            }
            $payloadJson = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($payload))
            $claims = $payloadJson | ConvertFrom-Json
            $roles = @($claims.roles)
            $sortedRoles = $roles | Sort-Object
            Write-Host "Graph token roles for restore: $($sortedRoles -join ', ')"

            $missingRoles = @()
            $requiredIntuneWriteRoles = @(
              'DeviceManagementApps.ReadWrite.All',
              'DeviceManagementConfiguration.ReadWrite.All',
              'DeviceManagementManagedDevices.ReadWrite.All',
              'DeviceManagementRBAC.ReadWrite.All',
              'DeviceManagementScripts.ReadWrite.All',
              'DeviceManagementServiceConfig.ReadWrite.All',
              'Group.Read.All'
            )
            foreach ($role in $requiredIntuneWriteRoles) {
              if (-not ($roles -contains $role)) { $missingRoles += $role }
            }

            if ($env:INCLUDE_ENTRA_UPDATE -eq "true") {
              $requiredEntraWriteRoles = @(
                'Policy.Read.All',
                'Policy.ReadWrite.ConditionalAccess'
              )
              foreach ($role in $requiredEntraWriteRoles) {
                if (-not ($roles -contains $role)) { $missingRoles += $role }
              }
            }

            if ($missingRoles.Count -gt 0) {
              $missingRoles = $missingRoles | Select-Object -Unique | Sort-Object
              Write-Host "##vso[task.logissue type=error]Graph token is missing restore permissions: $($missingRoles -join ', ')"
              throw "Service connection token is missing required Graph application permissions for restore."
            }

            Write-Host "##vso[task.setvariable variable=accessToken;issecret=true]$accessToken"
        env:
          INCLUDE_ENTRA_UPDATE: ${{ parameters.includeEntraUpdate }}

      - task: Bash@3
        displayName: Run IntuneCD restore/update
        inputs:
          targetType: inline
          script: |
            set -euo pipefail
            bash "$(ASTRAL_SCRIPTS)/run_intunecd_update.sh"
          failOnStderr: false
        env:
          RESTORE_SOURCE_PATH: $(RESTORE_SOURCE_PATH)
          DRY_RUN: ${{ parameters.dryRun }}
          UPDATE_ASSIGNMENTS: ${{ parameters.updateAssignments }}
          REMOVE_UNMANAGED: ${{ parameters.removeObjectsNotInBaseline }}
          ENTRA_UPDATE: ${{ parameters.includeEntraUpdate }}
          MAX_WORKERS: ${{ parameters.maxWorkers }}
          EXCLUDE_CSV: ${{ parameters.excludeCsv }}
          GRAPH_TOKEN: $(accessToken)
